  <div class="lightbox" id="lb" hidden><button class="lb-prev" aria-label="Previous">‹</button><img alt=""><button class="lb-next" aria-label="Next">›</button></div>
  <script>
  (function(){var lb=document.getElementById('lb'),img=lb.querySelector('img'),all=[].slice.call(document.querySelectorAll('a.zoom')),list=all,i=0;
  [].slice.call(document.querySelectorAll('.toc.tabs a')).forEach(function(t){t.addEventListener('click',function(e){e.preventDefault();document.querySelectorAll('.toc.tabs a').forEach(function(x){x.classList.toggle('on',x===t);});document.querySelectorAll('section.chapter').forEach(function(c){c.hidden='#'+c.id!==t.getAttribute('href');});});});
  function show(n){i=(n+list.length)%list.length;img.src=list[i].href;img.alt=list[i].querySelector('img').alt;lb.hidden=false;}
  all.forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();list=all.filter(function(x){return x.offsetParent!==null;});show(list.indexOf(a));});});
  lb.querySelector('.lb-prev').onclick=function(e){e.stopPropagation();show(i-1);};
  lb.querySelector('.lb-next').onclick=function(e){e.stopPropagation();show(i+1);};
  lb.addEventListener('click',function(){lb.hidden=true;img.src='';});
  document.addEventListener('keydown',function(e){if(lb.hidden)return;if(e.key==='Escape')lb.click();if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);});})();
  </script>
